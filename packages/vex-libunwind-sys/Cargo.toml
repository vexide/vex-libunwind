[package]
name = "vex-libunwind-sys"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "LLVM libunwind FFI bindings for VEX V5 robots"
keywords = ["vex", "v5", "unwind", "libunwind"]
categories = [
    "external-ffi-bindings",
    "embedded",
    "science::robotics",
    "no-std::no-alloc",
]
authors = [
    "vexide",
    "Lewis McClelland <lewis@lewismcclelland.me>",
    "Tropical",
    "Gavin Niederman <gavinniederman@gmail.com>",
]
repository = "https://github.com/vexide/vex-libunwind"
homepage = "https://vexide.dev"
links = "unwind"
rust-version = "1.85.0"

[dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["armv7a-vex-v5"]
cargo-args = [
    "-Zbuild-std=std,panic_abort",
    "-Zbuild-std-features=compiler-builtins-mem",
]
